# Dropsified – app.dropsified.com (Portal) + *.dropsified.com (Store subdomains)
# SSL app: certbot certonly --webroot -w /var/www/html -d app.dropsified.com
# SSL wildcard: certbot certonly --manual -d "*.dropsified.com" -d dropsified.com --preferred-challenges dns

# ========== HTTP (port 80) – ACME challenge + redirect to HTTPS ==========
server {
    listen 80;
    server_name app.dropsified.com;
    root /var/www/html;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}

# ========== Store subdomains (*.dropsified.com) – HTTP → HTTPS ==========
# Matches any subdomain except "app" (app handled above)
server {
    listen 80;
    server_name ~^(?!app\.)[a-z0-9-]+\.dropsified\.com$;
    return 302 https://$host$request_uri;
}

# ========== app.dropsified.com → Portal (Next.js :3001) ==========
server {
    listen 443 ssl http2;
    server_name app.dropsified.com;

    ssl_certificate     /etc/letsencrypt/live/app.dropsified.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.dropsified.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ========== Store subdomains (*.dropsified.com) → same app (Next.js :3001) ==========
# e.g. acme.dropsified.com → store "acme". App uses Host header to rewrite to /store/acme.
# (SSL options inherited from first 443 block – no include/ssl_dhparam here to avoid "redefined" warning)
server {
    listen 443 ssl http2;
    server_name *.dropsified.com;

    ssl_certificate     /etc/letsencrypt/live/dropsified.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dropsified.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
