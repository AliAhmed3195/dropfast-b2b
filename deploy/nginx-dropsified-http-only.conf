server {
    listen 80;
    server_name app.dropsified.com;
    root /var/www/html;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}
